<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile DevTools - Vanilla JS Example</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #09090b;
        color: #f4f4f5;
        padding: 24px;
      }
      .card {
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 12px;
        padding: 20px;
        max-width: 480px;
        margin: 0 auto;
      }
      button {
        background: #f59e0b;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        margin: 4px;
        transition: background 0.15s;
      }
      button:hover {
        background: #d97706;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>🍦 Mobile DevTools - Vanilla JS Example</h2>
      <p>
        Count: <strong id="count-label">0</strong>
      </p>
      <div>
        <button id="btn-logs">Trigger Logs</button>
        <button id="btn-fetch">Trigger Network Fetch</button>
        <button id="btn-storage">Set Storage</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
